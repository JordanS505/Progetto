<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="/css/styleGestione.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione utenti</title>
</head>

<body>
    <header>
        <h2>Pagina gestione utenti</h2>
    </header>
    <div class="container">
        <div class="section">
            <h3>Aggiungi un utente:</h3>
            <button id="add">Aggiungi</button>
        </div>
        <div class="section">
            <h3>Cerca un utente</h3>
            <label for="nome">Nome</label>
            <input id="nome" type="text">
            <label for="cognome">Cognome</label>
            <input id="cognome" type="text">
            <label for="cf">Codice Fiscale</label>
            <input id="cf" type="text">
            <label for="data">Data di nascita</label>
            <input id="data" type="date" disabled>
            <input type="button" value="Cerca" onclick="cercaUtenti()">
        </div>
        <div id="risultati"></div>
    </div>
	<script src="https://kit.fontawesome.com/a700e0e2c4.js" crossorigin="anonymous"></script>
	<script src="/js/gestione.js"></script>
</body>

</html>
